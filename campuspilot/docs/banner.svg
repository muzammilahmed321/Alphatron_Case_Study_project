    <circle cx="148" cy="50" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="cy" values="50;19;50" dur="8s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="895" cy="180" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="180;159;180" dur="12s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="388" cy="144" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="144;120;144" dur="10s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="939" cy="167" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cy" values="167;140;167" dur="6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="357" cy="195" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="195;179;195" dur="12s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1162" cy="180" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="180;148;180" dur="10s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="954" cy="55" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="55;39;55" dur="10s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="144" cy="178" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="cy" values="178;152;178" dur="12s" begin="1.1s" repeatCount="indefinite"/></circle>
