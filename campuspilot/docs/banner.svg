<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CampusPilot, an adaptive academic recovery agent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1245"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b9c4ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#blur)" opacity="0.6">
      <circle r="120" cx="150" cy="60" fill="#7c5cff">
        <animate attributeName="cx" values="150;330;150" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;150;60" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="110" cx="1050" cy="280" fill="#22d3ee">
        <animate attributeName="cx" values="1050;880;1050" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;190;280" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="85" cx="620" cy="160" fill="#f472b6" opacity="0.5">
        <animate attributeName="cx" values="620;760;620" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="160;90;160" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="683" cy="97" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="97;66;97" dur="6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="212" cy="207" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="207;187;207" dur="6s" begin="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="64" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="64;48;64" dur="12s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="237" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="237;203;237" dur="6s" begin="3.8s" repeatCount="indefinite"/></circle>
