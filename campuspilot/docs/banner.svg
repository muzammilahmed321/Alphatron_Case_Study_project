    <circle cx="834" cy="220" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="cy" values="220;194;220" dur="6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1145" cy="162" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="cy" values="162;140;162" dur="12s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="203" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="203;185;203" dur="12s" begin="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="189" cy="110" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="110;96;110" dur="8s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1013" cy="113" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="cy" values="113;86;113" dur="10s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="1114" cy="209" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="209;179;209" dur="10s" begin="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="253" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="253;227;253" dur="12s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="266" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="cy" values="266;250;266" dur="12s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="447" cy="245" r="1.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="245;230;245" dur="6s" begin="1.4s" repeatCount="indefinite"/></circle>
    
    <rect x="330" y="95" width="70" height="70" rx="20" fill="url(#logo)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" transform="translate(341,106) scale(2)" fill="#ffffff"/>

    <text x="425" y="150" font-size="72" font-weight="800" fill="url(#title)">CampusPilot</text>

    <text x="600" y="215" text-anchor="middle" font-size="27" fill="#aab6df" opacity="0">Your adaptive academic recovery agent<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="600" y="215" text-anchor="middle" font-size="27" fill="#aab6df" opacity="0">Chat with your notes. Every answer is cited.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/></text>
    <text x="600" y="215" text-anchor="middle" font-size="27" fill="#aab6df" opacity="0">Fell behind? The agent re-plans. You approve.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/></text>
    
    <rect x="-300" y="244" width="300" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="x" values="-300;1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="288" text-anchor="middle" font-size="17" fill="#7f8db5" letter-spacing="1">FastAPI  ·  React  ·  LangGraph  ·  Gemini  ·  RAG</text>
