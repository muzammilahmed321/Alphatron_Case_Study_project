<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-label="Recovery agent pipeline: analyze, retrieve, plan, validate, explain, human review, persist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect width="1100" height="210" rx="16" fill="#0b1020"/>
    <line x1="148" y1="110" x2="178" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="296" y1="110" x2="326" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="444" y1="110" x2="474" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="592" y1="110" x2="622" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="740" y1="110" x2="770" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="888" y1="110" x2="918" y2="110" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
    
    <g>
      <rect x="30" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <text x="89" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Analyze</text>
      <text x="89" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">quiz + missed</text>
    </g>
    <g>
      <rect x="178" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="1.15s" repeatCount="indefinite"/>
      </rect>
      <text x="237" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Retrieve</text>
      <text x="237" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">PDF pages</text>
    </g>
    <g>
      <rect x="326" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="2.3s" repeatCount="indefinite"/>
      </rect>
      <text x="385" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Plan</text>
      <text x="385" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">code builds</text>
    </g>
    <g>
      <rect x="474" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="3.45s" repeatCount="indefinite"/>
      </rect>
      <text x="533" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Validate</text>
      <text x="533" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">code checks</text>
    </g>
    <g>
      <rect x="622" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="681" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Explain</text>
      <text x="681" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">plain language</text>
    </g>
    <g>
      <rect x="770" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="5.75s" repeatCount="indefinite"/>
      </rect>
      <text x="829" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Human review</text>
      <text x="829" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">approve / reject</text>
    </g>
    <g>
      <rect x="918" y="78" width="118" height="64" rx="14" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="8s" begin="6.9s" repeatCount="indefinite"/>
      </rect>
      <text x="977" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Persist</text>
      <text x="977" y="126" text-anchor="middle" font-size="11" fill="#9aa4c0">save or keep</text>
    </g>

    <path d="M533 78 C533 30 385 30 385 78" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="459" y="30" text-anchor="middle" font-size="12" fill="#fbbf24">retry once if the plan has problems</text>

    <circle r="7" fill="#22d3ee">
      <animateMotion dur="8s" repeatCount="indefinite" path="M30,110 L1046,110"/>
    </circle>

    <text x="550" y="185" text-anchor="middle" font-size="13" fill="#7f8db5">No data, untested topics, or on track: the agent stops early with a message instead of changing your plan.</text>
  </g>
</svg>
